<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <script>
    // Splash theme = the app's saved choice (shared_preferences stores it as a
    // JSON string under "flutter.settings_theme_mode"); "system" or nothing
    // falls through to prefers-color-scheme in the splash CSS.
    try {
      var t = JSON.parse(localStorage.getItem('flutter.settings_theme_mode') || 'null');
      if (t === 'dark' || t === 'light') document.documentElement.setAttribute('data-theme', t);
    } catch (e) {}
  </script>
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Stiže: Belgrade buses, trams and trolleybuses live on the map, with arrivals for every stop. Gradski prevoz Beograd uživo: dolasci, stanice, red vožnje.">

  <!-- Full-bleed on mobile web: the map renders edge-to-edge (including under
       the status bar / notch), while in-app controls keep clear of it via
       Flutter SafeArea. viewport-fit=cover exposes the safe-area insets;
       black-translucent lets content extend under the iOS status bar (X1). -->
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

  <!-- Browser & PWA chrome color: paint the mobile browser's status/URL bar
       (Android Chrome) and the installed-PWA title bar with the app's own
       surface — the sheet background — instead of the Flutter default blue
       (#0175C2), which showed as a blue strip above the map. Two values because
       the app follows the system theme (ThemeMode.system): light surface in
       light mode, the dark sheet surface (#151515) in dark (Stiže design system bg). On iOS this is a
       no-op — black-translucent (below) keeps the status bar transparent over
       the full-bleed map. -->
  <meta name="theme-color" content="#f4f4f2" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#151515" media="(prefers-color-scheme: dark)">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Stiže">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

  <!-- Favicon -->
  <!-- Stiže mark: a rounded accent-green square, same form as the Growth
       Test Planner's favicon. SVG for modern browsers, PNG fallback. -->
  <link rel="icon" type="image/svg+xml" href="favicon.svg"/>
  <link rel="icon" type="image/png" sizes="32x32" href="favicon.png"/>

  <title>Stiže</title>
  <link rel="manifest" href="manifest.json">

  <script>
    // Links shared before the switch to path URLs look like /#/stop/123: move
    // the route into the path before Flutter reads the location.
    if (location.hash.indexOf('#/') === 0) {
      history.replaceState(null, '', location.hash.slice(1) || '/');
    }
  </script>
  <script>
    // Keep `viewport-fit=cover` alive. Flutter Web's engine rewrites the viewport
    // <meta> on startup with a fixed string that DROPS viewport-fit=cover
    // (flutter/flutter#116508), which silently switches off the iOS safe-area
    // insets — so the map stops rendering under the status bar / notch and the
    // top controls' SafeArea collapses to a 0 top inset (menu + recenter buttons
    // ride up under the notch). Re-assert cover whenever the engine strips it: a
    // MutationObserver on <head> catches the overwrite whether the engine mutates
    // the tag's content or swaps the node. The observer's own setAttribute is a
    // no-op on the next pass (cover already present), so it can't loop. Disconnect
    // a few seconds after the first frame, by when the engine has settled.
    (function () {
      function ensureCover() {
        var vp = document.querySelector('meta[name=viewport]');
        if (!vp) return;
        var c = vp.getAttribute('content') || '';
        if (c.indexOf('viewport-fit=cover') === -1) {
          vp.setAttribute('content', c + (c ? ', ' : '') + 'viewport-fit=cover');
        }
      }
      ensureCover();
      var obs = new MutationObserver(ensureCover);
      obs.observe(document.head, {
        childList: true, subtree: true, attributes: true, attributeFilter: ['content'],
      });
      window.addEventListener('flutter-first-frame', function () {
        setTimeout(function () { ensureCover(); obs.disconnect(); }, 3000);
      });
    })();
  </script>

  <!-- MapLibre GL JS: the web rendering backend for the `maplibre` Flutter plugin. Served from our
       own domain (pinned in app/tool/maplibre/package.json, copied by sync.sh), not from a CDN. -->
  <script src="vendor/maplibre-gl/maplibre-gl.js"></script>
  <link href="vendor/maplibre-gl/maplibre-gl.css" rel="stylesheet"/>
  <script>
    // The `maplibre` Flutter plugin creates the GL JS map during the platform
    // view's initState — before Flutter has laid the view into its final slot —
    // so the map measures a 0-size viewport and never requests tiles until
    // something resizes it. Wrap the Map constructor to call resize() on a few
    // short timers after creation, once the real size is in place.
    (function () {
      function patch() {
        if (!(window.maplibregl && window.maplibregl.Map)) return false;
        var Orig = window.maplibregl.Map;
        if (Orig.__stizePatched) return true;
        function Patched(opts) {
          var m = new Orig(opts);
          window.__stizeMap = m;
          // Basemap labels in Serbian LATIN script (owner, 2026-11-22): the app
          // UI is EN/SR-Latin and the MapTiler style labels Belgrade in
          // Cyrillic. On every style (re)load, point each basemap symbol layer's
          // text at name:sr-Latn, then name:latin, then the original name. Only
          // layers fed by the style's own VECTOR sources are touched; the app's
          // GeoJSON layers (stops, vehicles, routes) keep their own fields.
          var LATIN = ['coalesce', ['get', 'name:sr-Latn'], ['get', 'name:latin'], ['get', 'name']];
          var latinize = function () {
            try {
              var st = m.getStyle();
              if (!st || !st.layers) return;
              st.layers.forEach(function (l) {
                if (l.type !== 'symbol' || !l.source) return;
                var src = st.sources && st.sources[l.source];
                if (!src || src.type !== 'vector') return;
                var tf = l.layout && l.layout['text-field'];
                if (!tf || JSON.stringify(tf).indexOf('name') < 0) return;
                if (JSON.stringify(tf) === JSON.stringify(LATIN)) return;
                m.setLayoutProperty(l.id, 'text-field', LATIN);
              });
            } catch (e) {}
          };
          m.on('style.load', latinize);
          // Kill double-tap / double-click zoom on EVERY map (home, coverage,
          // live-vehicles) at the source. We never use it — pinch is the only
          // zoom gesture — and it is the one map gesture that survives a
          // PointerInterceptor barrier in some iOS WebKit wrappers (Arc): a
          // double-tap on the drawer / a sheet / an island leaks through the
          // Flutter pointer barrier to the canvas underneath and zooms the map
          // in the background. Disabling it here removes the whole class of bug,
          // for every over-map overlay at once, independent of any wrapper's
          // pointer quirks. The Flutter plugin re-enables doubleClickZoom right
          // after construction (its `zoom` gesture bundles touch/scroll/dblclick
          // together and calls doubleClickZoom.enable()), so neuter enable() too
          // — otherwise the disable() below would be silently undone.
          try {
            m.doubleClickZoom.disable();
            m.doubleClickZoom.enable = function () {};
          } catch (e) {}
          // A map created when its container is ALREADY sized (e.g. the SECOND
          // map in the app — the Coverage tab, created after the home map) gets
          // no size change from resize(), so maplibre never kicks its initial
          // render: it stays blank and never fires 'load' (so the Flutter
          // plugin's onStyleLoaded, and every layer added from it, is missed).
          // Force the render loop to run until the map has loaded + settled,
          // then drop back to on-demand rendering.
          m.repaint = true;
          var stopRepaint = function () { try { m.repaint = false; } catch (e) {} };
          m.once('idle', stopRepaint);
          setTimeout(stopRepaint, 25000); // fallback: never repaint forever
          // Flutter web settles the platform-view layout over a variable window
          // (sometimes several seconds), and until then GL JS won't request
          // tiles or repaint. Nudge resize() periodically until well past that
          // settle; once tiles are up, resize() is a cheap no-op. Also observe
          // the container for any later size changes.
          var ticks = 0;
          var iv = setInterval(function () {
            try { m.resize(); } catch (e) {}
            // maplibre-gl-js caches "image missing" for a symbol layer that was
            // added before its icon (added async via addImageFromWidget) reached
            // the sprite atlas, and never re-evaluates. Re-setting icon-image on
            // our own ('stg-*') symbol layers forces that re-evaluation so the
            // stop/cluster markers actually paint. A no-op once they're up.
            try {
              var st = m.getStyle();
              (st.layers || []).forEach(function (l) {
                if (l.type === 'symbol' && l.layout &&
                    typeof l.layout['icon-image'] === 'string' &&
                    l.layout['icon-image'].indexOf('stg-') === 0) {
                  m.setLayoutProperty(l.id, 'icon-image', l.layout['icon-image']);
                }
              });
            } catch (e) {}
            if (++ticks > 44) clearInterval(iv); // ~22s at 500ms
          }, 500);
          try {
            var ro = new ResizeObserver(function () { try { m.resize(); } catch (e) {} });
            ro.observe(m.getContainer());
          } catch (e) {}
          return m;
        }
        Patched.prototype = Orig.prototype;
        Object.keys(Orig).forEach(function (k) { try { Patched[k] = Orig[k]; } catch (e) {} });
        Patched.__stizePatched = true;
        window.maplibregl.Map = Patched;
        return true;
      }
      if (!patch()) {
        var iv = setInterval(function () { if (patch()) clearInterval(iv); }, 30);
        setTimeout(function () { clearInterval(iv); }, 8000);
      }
    })();
  </script>

  <style>
    /* Matches the app's own theme background so the pre-Flutter paint isn't a
       jarring white flash while CanvasKit/fonts download on a cold load. */
    html, body {
      height: 100%;
      margin: 0;
      background: #f4f4f2;
    }
    /* Pin the app to the full visual viewport on iOS Safari (F3b). Without this
       the page can scroll/rubber-band and leave a strip of body background
       under the status bar, and the map doesn't fill edge-to-edge. `position:
       fixed; inset: 0` fills the viewport *including* the safe areas exposed by
       viewport-fit=cover; disabling scroll/overscroll stops the strip and the
       bounce. The map (and Flutter SafeArea for the controls) handle insets. */
    body {
      position: fixed;
      inset: 0;
      width: 100%;
      overflow: hidden;
      overscroll-behavior: none;
    }
    @media (prefers-color-scheme: dark) {
      html:not([data-theme="light"]), html:not([data-theme="light"]) body { background: #151515; }
    }
    html[data-theme="dark"], html[data-theme="dark"] body { background: #151515; }
    /* Skeleton of the first screen, shown until Flutter paints its first frame.
       It mirrors the real layout (sizes from context_slot.dart and
       nearby_sheet.dart) so the app appears in place instead of popping in:
       mobile = round buttons, search pill, sheet at its 190px rest;
       desktop (>= 840px, kContextPanelBreakpoint) = the left island panel
       (12px inset, clamp(360, 28vw, 400)) and the right control stack.
       The map area uses the basemap background, so tiles fade in seamlessly.
       Theme: the app's saved choice (localStorage), else the system. Never
       intercepts input; removed entirely on the first Flutter frame. */
    #stize-loading {
      --map: #f3f0ec; --card: #ffffff; --sheet: #f4f4f2; --btn: #ffffff;
      --btn-ink: #151515; --sk: rgba(21, 21, 21, 0.07); --sk-hi: rgba(21, 21, 21, 0.14);
      --shadow: 0 2px 10px rgba(0, 0, 0, 0.12);
      position: fixed;
      inset: 0;
      background: var(--map);
      pointer-events: none;
      overflow: hidden;
    }
    html[data-theme="dark"] #stize-loading {
      --map: #191d27; --card: #212121; --sheet: #1f1f1f; --btn: #212121;
      --btn-ink: #2a2a2a; --sk: rgba(255, 255, 255, 0.07); --sk-hi: rgba(255, 255, 255, 0.14);
      --shadow: 0 2px 10px rgba(0, 0, 0, 0.4);
    }
    @media (prefers-color-scheme: dark) {
      html:not([data-theme="light"]) #stize-loading {
        --map: #191d27; --card: #212121; --sheet: #1f1f1f; --btn: #212121;
        --btn-ink: #2a2a2a; --sk: rgba(255, 255, 255, 0.07); --sk-hi: rgba(255, 255, 255, 0.14);
        --shadow: 0 2px 10px rgba(0, 0, 0, 0.4);
      }
    }
    #stize-loading .sk {
      background: linear-gradient(90deg, var(--sk) 0%, var(--sk-hi) 50%, var(--sk) 100%);
      background-size: 200% 100%;
      animation: sk-shimmer 1.4s linear infinite;
      border-radius: 6px;
    }
    @keyframes sk-shimmer { from { background-position: 100% 0; } to { background-position: -100% 0; } }
    @media (prefers-reduced-motion: reduce) { #stize-loading .sk { animation: none; } }
    #stize-loading .sk-btn {
      position: absolute; top: calc(env(safe-area-inset-top, 0px) + 12px);
      width: 48px; height: 48px; border-radius: 50%;
      background: var(--btn); box-shadow: var(--shadow);
    }
    #stize-loading .sk-btn.l { left: 12px; }
    #stize-loading .sk-btn.r { right: 12px; background: var(--btn-ink); }
    #stize-loading .sk-pill {
      position: absolute; left: 16px; right: 16px; height: 52px;
      bottom: calc(clamp(20dvh, 190px, 42dvh) + 17px);
      border-radius: 16px; background: var(--card); box-shadow: var(--shadow);
      display: flex; align-items: center; gap: 14px; padding: 0 16px;
    }
    #stize-loading .sk-ico { width: 24px; height: 24px; border-radius: 50%; flex: none; }
    #stize-loading .sk-lines { flex: 1; display: flex; flex-direction: column; gap: 7px; }
    #stize-loading .sk-sheet {
      position: absolute; left: 0; right: 0; bottom: 0;
      height: clamp(20dvh, 190px, 42dvh);
      border-radius: 28px 28px 0 0; background: var(--sheet);
      box-shadow: 0 -2px 12px rgba(0, 0, 0, 0.08);
      padding: 14px 16px; box-sizing: border-box;
      display: flex; flex-direction: column; gap: 12px;
    }
    #stize-loading .sk-row { display: flex; align-items: center; gap: 12px; }
    #stize-loading .sk-card {
      background: var(--card); border-radius: 16px; padding: 14px 16px;
      display: flex; flex-direction: column; gap: 12px;
    }
    #stize-loading .sk-side { display: none; }
    @media (min-width: 840px) {
      #stize-loading .sk-pill, #stize-loading .sk-sheet, #stize-loading .sk-btn.l { display: none; }
      #stize-loading .sk-btn.r { top: 12px; width: 40px; height: 40px; }
      #stize-loading .sk-side {
        display: flex; flex-direction: column; gap: 8px;
        position: absolute; left: 12px; top: 12px;
        width: clamp(360px, 28vw, 400px);
      }
      #stize-loading .sk-menu {
        flex: none; width: 48px; height: 48px; border-radius: 50%;
        background: var(--btn); box-shadow: var(--shadow);
      }
      #stize-loading .sk-search {
        flex: 1; height: 48px; border-radius: 16px; background: var(--card); box-shadow: var(--shadow);
        display: flex; align-items: center; gap: 14px; padding: 0 16px;
      }
      #stize-loading .sk-zoom {
        position: absolute; right: 12px; top: 100px; width: 40px; height: 80px;
        border-radius: 20px; background: var(--btn); box-shadow: var(--shadow);
      }
    }
  </style>
</head>
<body>
  <div id="stize-loading" role="progressbar" aria-label="Loading Stiže">
    <div class="sk-btn l"></div>
    <div class="sk-btn r"></div>
    <div class="sk-pill">
      <div class="sk sk-ico"></div>
      <div class="sk-lines"><div class="sk" style="width: 30%; height: 8px"></div><div class="sk" style="width: 75%; height: 11px"></div></div>
      <div class="sk sk-ico"></div>
    </div>
    <div class="sk-sheet">
      <div class="sk-row"><div class="sk sk-ico"></div><div class="sk-lines"><div class="sk" style="width: 62%; height: 11px"></div><div class="sk" style="width: 40%; height: 8px"></div></div></div>
      <div class="sk-card">
        <div class="sk-row"><div class="sk" style="width: 64px; height: 28px; border-radius: 8px"></div><div style="flex: 1"></div><div class="sk" style="width: 48px; height: 28px"></div></div>
        <div class="sk" style="width: 55%; height: 11px"></div>
      </div>
    </div>
    <div class="sk-side">
      <div class="sk-row" style="gap: 8px">
        <div class="sk-menu"></div>
        <div class="sk-search">
          <div class="sk sk-ico"></div>
          <div class="sk-lines"><div class="sk" style="width: 30%; height: 8px"></div><div class="sk" style="width: 70%; height: 11px"></div></div>
          <div class="sk sk-ico"></div>
        </div>
      </div>
      <div class="sk-card">
        <div class="sk-row"><div class="sk sk-ico"></div><div class="sk-lines"><div class="sk" style="width: 62%; height: 11px"></div><div class="sk" style="width: 40%; height: 8px"></div></div></div>
      </div>
      <div class="sk-card">
        <div class="sk-row"><div class="sk" style="width: 64px; height: 28px; border-radius: 8px"></div><div style="flex: 1"></div><div class="sk" style="width: 48px; height: 28px"></div></div>
        <div class="sk" style="width: 55%; height: 11px"></div>
        <div style="height: 4px"></div>
        <div class="sk-row"><div class="sk" style="width: 64px; height: 28px; border-radius: 8px"></div><div style="flex: 1"></div><div class="sk" style="width: 48px; height: 28px"></div></div>
        <div class="sk" style="width: 45%; height: 11px"></div>
      </div>
    </div>
    <div class="sk-zoom"></div>
  </div>
  <script>
    // Drop the loading splash once Flutter paints its first frame, so it never
    // lingers over the app.
    window.addEventListener('flutter-first-frame', function () {
      var el = document.getElementById('stize-loading');
      if (el) el.remove();
    });
  </script>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
