# Tests on every push and PR. Merging to main deploys to production
# (Cloudflare Git builds), so a branch is merged only when this is green.
name: CI

on:
  push:
    branches-ignore: []
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test

  app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          # Keep in sync with app/.metadata and app/tool/cf_pages_build.sh.
          flutter-version: 3.44.5
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze lib test --no-fatal-infos
      - run: flutter test
