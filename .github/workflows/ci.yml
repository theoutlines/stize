# Tests on every push and PR. Merging to main deploys to production
# (Cloudflare Git builds), so a branch is merged only when this is green.
name: CI

on:
  push:
    branches-ignore: []
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # This repo is public: nothing private may land in it (history included).
  # Reports, prompts, backlogs, a long CLAUDE.md, env/key files, key-like
  # strings and personal email addresses fail the build.
  public-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tool/public_guard.py

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test

  # Keeps the codebase from silently swelling: files over 500 lines may not
  # grow, no dead files/widgets/exports/strings, no copy-pasted blocks. Known
  # debt sits in tool/structure/baseline.json. Strict: a new finding fails the
  # build, and so does a baseline that still lists debt already paid off.
  # Adding debt on purpose means editing baseline.json, which shows in review.
  structure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python3 tool/structure/check.py --strict
      - name: Lines this change adds and removes (app/lib, backend/src)
        if: github.ref != 'refs/heads/main'
        run: git diff --shortstat origin/main...HEAD -- app/lib backend/src ':!app/lib/l10n'

  app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          # Keep in sync with app/.metadata and app/tool/cf_pages_build.sh.
          flutter-version: 3.44.5
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze lib test --no-fatal-infos
      - run: flutter test
